name: MoonBit checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: moon version --all

      - name: Update MoonBit package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check package
        run: moon check

      - name: Check generated public interface
        run: |
          moon info
          git diff --exit-code -- pkg.generated.mbti

      - name: Run tests
        run: moon test

      - name: Run valid feed example
        run: |
          output=$(moon run cmd/main examples/valid 2>&1)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fx 'PASS (supported checks only): 6 parsed files, 8 records, 0 findings'

      - name: Check invalid feed diagnostics and exit status
        shell: bash
        run: |
          set +e
          output=$(moon run cmd/main examples/invalid 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'ERROR trips.txt:2 route_id="UNKNOWN" [unresolved_reference]'
          printf '%s\n' "$output" | grep -F 'ERROR stop_times.txt:2 arrival_time="25:60:00" [invalid_time]'
          printf '%s\n' "$output" | grep -F 'ERROR stop_times.txt:2 departure_time="25:61:00" [invalid_time]'
          printf '%s\n' "$output" | grep -F 'FAIL: 5 parsed files, 5 records, 3 findings'
