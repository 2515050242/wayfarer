name: MoonBit checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: moon version --all

      - name: Update MoonBit package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check package
        run: moon check

      - name: Check generated public interface
        run: |
          moon info
          git diff --exit-code -- pkg.generated.mbti

      - name: Run tests
        run: moon test

      - name: Run valid feed example
        run: |
          output=$(moon run cmd/main examples/valid 2>&1)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fx 'PASS (supported checks only): 7 parsed files, 9 records, 0 findings'

      - name: Run reusable CSV profile examples
        shell: bash
        run: |
          valid_output=$(moon run cmd/profile-demo examples/inventory-profile 2>&1)
          printf '%s\n' "$valid_output"
          printf '%s\n' "$valid_output" | grep -Fx 'PASS: 2 CSV tables, 4 records, 0 findings'
          set +e
          invalid_output=$(moon run cmd/profile-demo examples/inventory-profile-invalid 2>&1)
          invalid_status=$?
          set -e
          printf '%s\n' "$invalid_output"
          test "$invalid_status" -eq 1
          printf '%s\n' "$invalid_output" | grep -Fx 'ERROR orders.csv:3 product_id [unresolved_reference] referenced value does not exist in products.csv'
          printf '%s\n' "$invalid_output" | grep -Fx 'FAIL: 2 CSV tables, 4 records, 1 finding'
      - name: Run JSON-configured CSV profile examples
        shell: bash
        run: |
          valid_output=$(moon run cmd/csv-check examples/inventory-profile.json examples/inventory-profile 2>&1)
          printf '%s\n' "$valid_output"
          printf '%s\n' "$valid_output" | grep -Fx 'PASS: 2 CSV tables, 4 records, 0 findings'
          set +e
          invalid_output=$(moon run cmd/csv-check examples/inventory-profile.json examples/inventory-profile-invalid 2>&1)
          invalid_status=$?
          set -e
          printf '%s\n' "$invalid_output"
          test "$invalid_status" -eq 1
          printf '%s\n' "$invalid_output" | grep -Fx 'ERROR orders.csv:3 product_id="P9" [unresolved_reference] referenced value does not exist in products.csv'
          printf '%s\n' "$invalid_output" | grep -Fx 'FAIL: 2 CSV tables, 4 records, 1 finding'
          set +e
          empty_profile_output=$(moon run cmd/csv-check examples/empty-profile.json examples/inventory-profile 2>&1)
          empty_profile_status=$?
          set -e
          printf '%s\n' "$empty_profile_output"
          test "$empty_profile_status" -eq 2
          printf '%s\n' "$empty_profile_output" | grep -F 'ERROR examples/empty-profile.json [invalid_profile] profile must declare at least one table'

      - name: Exercise a second CSV domain and composite key
        shell: bash
        run: |
          valid_output=$(moon run cmd/csv-check examples/enrollment-profile.json examples/enrollment-profile 2>&1)
          printf '%s\n' "$valid_output"
          printf '%s\n' "$valid_output" | grep -Fx 'PASS: 3 CSV tables, 7 records, 0 findings'
          set +e
          invalid_output=$(moon run cmd/csv-check examples/enrollment-profile.json examples/enrollment-profile-invalid 2>&1)
          invalid_status=$?
          set -e
          printf '%s\n' "$invalid_output"
          test "$invalid_status" -eq 1
          printf '%s\n' "$invalid_output" | grep -Fx 'ERROR enrollments.csv:4 learner_id,class_id="L1,C1" [duplicate_key] key value is already used in this table'
          printf '%s\n' "$invalid_output" | grep -Fx 'ERROR enrollments.csv:2 class_id="C9" [unresolved_reference] referenced value does not exist in classes.csv'
          printf '%s\n' "$invalid_output" | grep -Fx 'FAIL: 3 CSV tables, 7 records, 2 findings'

      - name: Exercise field rules and the JSON report
        shell: bash
        run: |
          valid_output=$(moon run cmd/csv-check examples/course-catalog-profile.json examples/course-catalog 2>&1)
          printf '%s\n' "$valid_output"
          printf '%s\n' "$valid_output" | grep -Fx 'PASS: 2 CSV tables, 4 records, 0 findings'
          set +e
          invalid_output=$(moon run cmd/csv-check examples/course-catalog-profile.json examples/course-catalog-invalid 2>&1)
          invalid_status=$?
          json_output=$(moon run cmd/csv-check examples/course-catalog-profile.json examples/course-catalog-invalid --json 2>&1)
          json_status=$?
          set -e
          printf '%s\n' "$invalid_output"
          test "$invalid_status" -eq 1
          printf '%s\n' "$invalid_output" | grep -Fx 'FAIL: 2 CSV tables, 4 records, 5 findings'
          printf '%s\n' "$invalid_output" | grep -F 'ERROR courses.csv:2 capacity=' | grep -F '[invalid_integer_value]'
          printf '%s\n' "$invalid_output" | grep -F 'ERROR courses.csv:3 start_date=' | grep -F '[invalid_date_value]'
          printf '%s\n' "$invalid_output" | grep -F 'ERROR courses.csv:3 level=' | grep -F '[value_not_allowed]'
          printf '%s\n' "$invalid_output" | grep -F 'ERROR sessions.csv:3 seats=' | grep -F '[invalid_number_value]'
          printf '%s\n' "$invalid_output" | grep -F 'ERROR sessions.csv:3 course_id=' | grep -F '[unresolved_reference]'
          printf '%s\n' "$json_output"
          test "$json_status" -eq 1
          printf '%s\n' "$json_output" | grep -F '"count":5'
          printf '%s\n' "$json_output" | grep -F '"passed":false'
          printf '%s\n' "$json_output" | grep -F '"code":"invalid_integer_value"'

      - name: Reject empty required tables and one-stop trips
        shell: bash
        run: |
          set +e
          empty_output=$(moon run cmd/main examples/header-only-required-table 2>&1)
          empty_status=$?
          one_stop_output=$(moon run cmd/main examples/single-stop-trip 2>&1)
          one_stop_status=$?
          set -e
          printf '%s\n' "$empty_output"
          test "$empty_status" -eq 1
          printf '%s\n' "$empty_output" | grep -Fx 'ERROR agency.txt:1 [empty_required_table] required table must contain at least one data record'
          printf '%s\n' "$empty_output" | grep -Fx 'FAIL: 6 parsed files, 7 records, 1 finding'
          printf '%s\n' "$one_stop_output"
          test "$one_stop_status" -eq 1
          printf '%s\n' "$one_stop_output" | grep -Fx 'ERROR trips.txt:2 trip_id="T1" [insufficient_stop_times] trip must have at least two stop_times records'
          printf '%s\n' "$one_stop_output" | grep -Fx 'FAIL: 6 parsed files, 6 records, 1 finding'

      - name: Reject forbidden GTFS field values and escape diagnostics
        shell: bash
        run: |
          set +e
          field_output=$(moon run cmd/main examples/field-value-errors 2>&1)
          field_status=$?
          control_output=$(moon run cmd/main examples/control-character-diagnostic 2>&1)
          control_status=$?
          set -e
          printf '%s\n' "$field_output"
          test "$field_status" -eq 1
          printf '%s\n' "$field_output" | grep -Fx 'ERROR stops.txt:2 stop_name="Platform \"East\"\tA" [forbidden_field_character] GTFS field values must not contain tabs, carriage returns, or newlines'
          printf '%s\n' "$field_output" | grep -Fx 'ERROR stops.txt:3 stop_name="North\nAnnex" [forbidden_field_character] GTFS field values must not contain tabs, carriage returns, or newlines'
          printf '%s\n' "$field_output" | grep -Fx 'ERROR stops.txt:5 stop_name="South\tGate" [forbidden_field_character] GTFS field values must not contain tabs, carriage returns, or newlines'
          printf '%s\n' "$field_output" | grep -Fx 'FAIL: 6 parsed files, 9 records, 3 findings'
          printf '%s\n' "$control_output"
          test "$control_status" -eq 1
          printf '%s\n' "$control_output" | grep -Fx 'ERROR trips.txt:2 service_id="WK\u001b[31m" [unresolved_reference] referenced ID does not exist in calendar.txt or calendar_dates.txt'
          printf '%s\n' "$control_output" | grep -Fx 'FAIL: 6 parsed files, 8 records, 1 finding'

      - name: Reject unsupported flexible-location feed
        shell: bash
        run: |
          set +e
          output=$(moon run cmd/main examples/unsupported-location-profile 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'ERROR locations.geojson [unsupported_location_profile]'
          printf '%s\n' "$output" | grep -F 'ERROR stop_times.txt:2 location_id="ZONE-1" [unsupported_location_profile]'
          printf '%s\n' "$output" | grep -Fx 'FAIL: 6 parsed files, 7 records, 2 findings'

      - name: Reject feeds without a service calendar
        shell: bash
        run: |
          set +e
          output=$(moon run cmd/main examples/no-service-calendar 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'ERROR calendar.txt/calendar_dates.txt [missing_service_calendar] at least one service calendar file is required'
          printf '%s\n' "$output" | grep -Fx 'FAIL: 5 parsed files, 7 records, 1 finding'

      - name: Validate stop-time windows and conditional fields
        shell: bash
        run: |
          set +e
          output=$(moon run cmd/main examples/stop-time-conditional-errors 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -Fx 'ERROR stop_times.txt:2 timepoint="2" [invalid_enum_value] timepoint must be empty, 0, or 1'
          printf '%s\n' "$output" | grep -Fx 'ERROR stop_times.txt:2 arrival_time="09:00:00" [forbidden_with_pickup_drop_off_window] arrival_time must be empty when a pickup/drop-off window is defined'
          printf '%s\n' "$output" | grep -Fx 'ERROR stop_times.txt:2 departure_time="09:01:00" [forbidden_with_pickup_drop_off_window] departure_time must be empty when a pickup/drop-off window is defined'
          printf '%s\n' "$output" | grep -Fx 'ERROR stop_times.txt:2 pickup_type="0" [forbidden_with_pickup_drop_off_window] pickup_type must be 1 or 2 when a pickup/drop-off window is defined'
          printf '%s\n' "$output" | grep -Fx 'ERROR stop_times.txt:2 drop_off_type="0" [forbidden_with_pickup_drop_off_window] drop_off_type must not be empty or 0 when a pickup/drop-off window is defined'
          printf '%s\n' "$output" | grep -Fx 'ERROR stop_times.txt:2 continuous_pickup="2" [forbidden_with_pickup_drop_off_window] continuous_pickup must be 1 or empty when a pickup/drop-off window is defined'
          printf '%s\n' "$output" | grep -Fx 'ERROR stop_times.txt:2 continuous_drop_off="0" [forbidden_with_pickup_drop_off_window] continuous_drop_off must be 1 or empty when a pickup/drop-off window is defined'
          printf '%s\n' "$output" | grep -Fx 'ERROR routes.txt:2 continuous_pickup="2" [forbidden_with_pickup_drop_off_window] continuous_pickup must be 1 or empty when a trip on this route defines a pickup/drop-off window'
          printf '%s\n' "$output" | grep -Fx 'ERROR routes.txt:2 continuous_drop_off="0" [forbidden_with_pickup_drop_off_window] continuous_drop_off must be 1 or empty when a trip on this route defines a pickup/drop-off window'
          printf '%s\n' "$output" | grep -Fx 'FAIL: 7 parsed files, 9 records, 9 findings'

      - name: Validate service-calendar dates and enums
        shell: bash
        run: |
          set +e
          output=$(moon run cmd/main examples/calendar-semantics-errors 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -Fx 'ERROR calendar.txt:2 monday="2" [invalid_enum_value] monday must be 0 or 1'
          printf '%s\n' "$output" | grep -Fx 'ERROR calendar.txt:2 end_date="20260101" [invalid_date_range] end_date must not precede start_date'
          printf '%s\n' "$output" | grep -Fx 'ERROR calendar_dates.txt:2 date="20230229" [invalid_date] date must be a valid Gregorian date in YYYYMMDD format'
          printf '%s\n' "$output" | grep -Fx 'ERROR calendar_dates.txt:2 exception_type="3" [invalid_enum_value] exception_type must be 1 or 2'
          printf '%s\n' "$output" | grep -Fx 'FAIL: 7 parsed files, 9 records, 4 findings'

      - name: Check invalid feed diagnostics and exit status
        shell: bash
        run: |
          set +e
          output=$(moon run cmd/main examples/invalid 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'ERROR trips.txt:2 route_id="UNKNOWN" [unresolved_reference]'
          printf '%s\n' "$output" | grep -F 'ERROR trips.txt:2 service_id="MISSING" [unresolved_reference]'
          printf '%s\n' "$output" | grep -F 'ERROR stop_times.txt:2 departure_time="25:61:00" [invalid_time]'
          printf '%s\n' "$output" | grep -F 'ERROR stop_times.txt:2 arrival_time="" [missing_required_time]'
          printf '%s\n' "$output" | grep -F 'ERROR stop_times.txt:4 arrival_time="25:00:00" [time_order_violation]'
          printf '%s\n' "$output" | grep -F 'ERROR calendar_dates.txt:3 service_id,date="WK,20261031" [duplicate_primary_key]'
          printf '%s\n' "$output" | grep -F 'FAIL: 6 parsed files, 9 records, 6 findings'

  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          $moonBin = Join-Path $HOME '.moon\bin'
          if (-not (Test-Path (Join-Path $moonBin 'moon.exe'))) {
            throw "MoonBit installation did not create $moonBin\moon.exe"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $moonBin
          $env:PATH = "$moonBin;$env:PATH"
          moon version --all

      - name: Update MoonBit package registry
        shell: pwsh
        run: moon update

      - name: Check formatting and package
        shell: pwsh
        run: |
          moon fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          moon check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check generated public interface
        shell: pwsh
        run: |
          moon info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- pkg.generated.mbti
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit tests
        shell: pwsh
        run: moon test

      - name: Run passing feed and verify failures
        shell: pwsh
        run: |
          $valid = & moon run cmd/main examples/valid 2>&1
          $validStatus = $LASTEXITCODE
          $validText = $valid -join "`n"
          Write-Output $validText
          if ($validStatus -ne 0 -or -not $validText.Contains('PASS (supported checks only): 7 parsed files, 9 records, 0 findings')) {
            throw 'The bundled valid feed did not pass with the documented summary.'
          }

          function Assert-Failure([string]$fixture, [string[]]$expected) {
            $output = & moon run cmd/main $fixture 2>&1
            $status = $LASTEXITCODE
            $text = $output -join "`n"
            Write-Output $text
            if ($status -ne 1) { throw "$fixture should exit with status 1; got $status." }
            foreach ($line in $expected) {
              if (-not $text.Contains($line)) { throw "$fixture did not contain expected diagnostic: $line" }
            }
            $global:LASTEXITCODE = 0
          }

          Assert-Failure 'examples/header-only-required-table' @(
            'ERROR agency.txt:1 [empty_required_table] required table must contain at least one data record',
            'FAIL: 6 parsed files, 7 records, 1 finding'
          )
          Assert-Failure 'examples/single-stop-trip' @(
            'ERROR trips.txt:2 trip_id="T1" [insufficient_stop_times] trip must have at least two stop_times records',
            'FAIL: 6 parsed files, 6 records, 1 finding'
          )
          Assert-Failure 'examples/field-value-errors' @(
            'ERROR stops.txt:2 stop_name="Platform \"East\"\tA" [forbidden_field_character]',
            'ERROR stops.txt:3 stop_name="North\nAnnex" [forbidden_field_character]',
            'ERROR stops.txt:5 stop_name="South\tGate" [forbidden_field_character]',
            'FAIL: 6 parsed files, 9 records, 3 findings'
          )
          Assert-Failure 'examples/control-character-diagnostic' @(
            'ERROR trips.txt:2 service_id="WK\u001b[31m" [unresolved_reference]',
            'FAIL: 6 parsed files, 8 records, 1 finding'
          )
          Assert-Failure 'examples/stop-time-conditional-errors' @(
            'ERROR stop_times.txt:2 timepoint="2" [invalid_enum_value] timepoint must be empty, 0, or 1',
            'ERROR stop_times.txt:2 arrival_time="09:00:00" [forbidden_with_pickup_drop_off_window]',
            'ERROR stop_times.txt:2 departure_time="09:01:00" [forbidden_with_pickup_drop_off_window]',
            'ERROR stop_times.txt:2 pickup_type="0" [forbidden_with_pickup_drop_off_window]',
            'ERROR stop_times.txt:2 drop_off_type="0" [forbidden_with_pickup_drop_off_window]',
            'ERROR stop_times.txt:2 continuous_pickup="2" [forbidden_with_pickup_drop_off_window]',
            'ERROR stop_times.txt:2 continuous_drop_off="0" [forbidden_with_pickup_drop_off_window]',
            'ERROR routes.txt:2 continuous_pickup="2" [forbidden_with_pickup_drop_off_window]',
            'ERROR routes.txt:2 continuous_drop_off="0" [forbidden_with_pickup_drop_off_window]',
            'FAIL: 7 parsed files, 9 records, 9 findings'
          )
          Assert-Failure 'examples/calendar-semantics-errors' @(
            'ERROR calendar.txt:2 monday="2" [invalid_enum_value] monday must be 0 or 1',
            'ERROR calendar.txt:2 end_date="20260101" [invalid_date_range] end_date must not precede start_date',
            'ERROR calendar_dates.txt:2 date="20230229" [invalid_date] date must be a valid Gregorian date in YYYYMMDD format',
            'ERROR calendar_dates.txt:2 exception_type="3" [invalid_enum_value] exception_type must be 1 or 2',
            'FAIL: 7 parsed files, 9 records, 4 findings'
          )

          $profileValid = & moon run cmd/profile-demo examples/inventory-profile 2>&1
          $profileValidStatus = $LASTEXITCODE
          $profileValidText = $profileValid -join "`n"
          Write-Output $profileValidText
          if ($profileValidStatus -ne 0 -or -not $profileValidText.Contains('PASS: 2 CSV tables, 4 records, 0 findings')) {
            throw 'The valid reusable CSV profile example did not pass.'
          }
          $profileInvalid = & moon run cmd/profile-demo examples/inventory-profile-invalid 2>&1
          $profileInvalidStatus = $LASTEXITCODE
          $profileInvalidText = $profileInvalid -join "`n"
          Write-Output $profileInvalidText
          if ($profileInvalidStatus -ne 1 -or -not $profileInvalidText.Contains('ERROR orders.csv:3 product_id [unresolved_reference] referenced value does not exist in products.csv') -or -not $profileInvalidText.Contains('FAIL: 2 CSV tables, 4 records, 1 finding')) {
            throw 'The invalid reusable CSV profile example did not produce the documented finding.'
          }

          $configuredValid = & moon run cmd/csv-check examples/inventory-profile.json examples/inventory-profile 2>&1
          $configuredValidStatus = $LASTEXITCODE
          $configuredValidText = $configuredValid -join "`n"
          Write-Output $configuredValidText
          if ($configuredValidStatus -ne 0 -or -not $configuredValidText.Contains('PASS: 2 CSV tables, 4 records, 0 findings')) {
            throw 'The JSON-configured profile did not pass its valid fixture.'
          }
          $configuredInvalid = & moon run cmd/csv-check examples/inventory-profile.json examples/inventory-profile-invalid 2>&1
          $configuredInvalidStatus = $LASTEXITCODE
          $configuredInvalidText = $configuredInvalid -join "`n"
          Write-Output $configuredInvalidText
          if ($configuredInvalidStatus -ne 1 -or -not $configuredInvalidText.Contains('ERROR orders.csv:3 product_id="P9" [unresolved_reference] referenced value does not exist in products.csv') -or -not $configuredInvalidText.Contains('FAIL: 2 CSV tables, 4 records, 1 finding')) {
            throw 'The JSON-configured profile did not report its invalid reference.'
          }
          $emptyProfile = & moon run cmd/csv-check examples/empty-profile.json examples/inventory-profile 2>&1
          $emptyProfileStatus = $LASTEXITCODE
          $emptyProfileText = $emptyProfile -join "`n"
          Write-Output $emptyProfileText
          if ($emptyProfileStatus -ne 2 -or -not $emptyProfileText.Contains('ERROR examples/empty-profile.json [invalid_profile] profile must declare at least one table')) {
            throw 'An unconstrained empty JSON profile should be rejected as invalid configuration.'
          }

          $enrollmentValid = & moon run cmd/csv-check examples/enrollment-profile.json examples/enrollment-profile 2>&1
          $enrollmentValidStatus = $LASTEXITCODE
          $enrollmentValidText = $enrollmentValid -join "`n"
          Write-Output $enrollmentValidText
          if ($enrollmentValidStatus -ne 0 -or -not $enrollmentValidText.Contains('PASS: 3 CSV tables, 7 records, 0 findings')) {
            throw 'The second synthetic CSV profile did not pass.'
          }
          $enrollmentInvalid = & moon run cmd/csv-check examples/enrollment-profile.json examples/enrollment-profile-invalid 2>&1
          $enrollmentInvalidStatus = $LASTEXITCODE
          $enrollmentInvalidText = $enrollmentInvalid -join "`n"
          Write-Output $enrollmentInvalidText
          if ($enrollmentInvalidStatus -ne 1 -or -not $enrollmentInvalidText.Contains('ERROR enrollments.csv:4 learner_id,class_id="L1,C1" [duplicate_key]') -or -not $enrollmentInvalidText.Contains('ERROR enrollments.csv:2 class_id="C9" [unresolved_reference]') -or -not $enrollmentInvalidText.Contains('FAIL: 3 CSV tables, 7 records, 2 findings')) {
            throw 'The second synthetic CSV profile did not report its duplicate key and unresolved reference.'
          }
          $catalogValid = & moon run cmd/csv-check examples/course-catalog-profile.json examples/course-catalog 2>&1
          $catalogValidStatus = $LASTEXITCODE
          $catalogValidText = $catalogValid -join "`n"
          Write-Output $catalogValidText
          if ($catalogValidStatus -ne 0 -or -not $catalogValidText.Contains('PASS: 2 CSV tables, 4 records, 0 findings')) {
            throw 'The course catalog profile did not pass.'
          }
          $catalogInvalid = & moon run cmd/csv-check examples/course-catalog-profile.json examples/course-catalog-invalid 2>&1
          $catalogInvalidStatus = $LASTEXITCODE
          $catalogInvalidText = $catalogInvalid -join "`n"
          Write-Output $catalogInvalidText
          if ($catalogInvalidStatus -ne 1 -or -not $catalogInvalidText.Contains('FAIL: 2 CSV tables, 4 records, 5 findings') -or -not $catalogInvalidText.Contains('[invalid_integer_value]') -or -not $catalogInvalidText.Contains('[invalid_date_value]') -or -not $catalogInvalidText.Contains('[value_not_allowed]') -or -not $catalogInvalidText.Contains('[invalid_number_value]')) {
            throw 'The course catalog profile did not report its field rule findings.'
          }
          $catalogJson = & moon run cmd/csv-check examples/course-catalog-profile.json examples/course-catalog-invalid --json 2>&1
          $catalogJsonStatus = $LASTEXITCODE
          $catalogJsonText = $catalogJson -join "`n"
          Write-Output $catalogJsonText
          if ($catalogJsonStatus -ne 1 -or -not $catalogJsonText.Contains('"count":5') -or -not $catalogJsonText.Contains('"passed":false')) {
            throw 'The JSON report did not encode the course catalog findings.'
          }
          exit 0
