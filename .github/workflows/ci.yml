name: MoonBit checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: moon version --all

      - name: Update MoonBit package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check package
        run: moon check

      - name: Check generated public interface
        run: |
          moon info
          git diff --exit-code -- pkg.generated.mbti

      - name: Run tests
        run: moon test

      - name: Run valid feed example
        run: |
          output=$(moon run cmd/main examples/valid 2>&1)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fx 'PASS (supported checks only): 7 parsed files, 9 records, 0 findings'

      - name: Reject unsupported flexible-location feed
        shell: bash
        run: |
          set +e
          output=$(moon run cmd/main examples/unsupported-location-profile 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'ERROR locations.geojson [unsupported_location_profile]'
          printf '%s\n' "$output" | grep -F 'ERROR stop_times.txt:2 location_id="ZONE-1" [unsupported_location_profile]'
          printf '%s\n' "$output" | grep -Fx 'FAIL: 6 parsed files, 6 records, 2 findings'

      - name: Reject feeds without a service calendar
        shell: bash
        run: |
          set +e
          output=$(moon run cmd/main examples/no-service-calendar 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'ERROR calendar.txt/calendar_dates.txt [missing_service_calendar] at least one service calendar file is required'
          printf '%s\n' "$output" | grep -Fx 'FAIL: 5 parsed files, 7 records, 1 finding'

      - name: Check invalid feed diagnostics and exit status
        shell: bash
        run: |
          set +e
          output=$(moon run cmd/main examples/invalid 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'ERROR trips.txt:2 route_id="UNKNOWN" [unresolved_reference]'
          printf '%s\n' "$output" | grep -F 'ERROR trips.txt:2 service_id="MISSING" [unresolved_reference]'
          printf '%s\n' "$output" | grep -F 'ERROR stop_times.txt:2 departure_time="25:61:00" [invalid_time]'
          printf '%s\n' "$output" | grep -F 'ERROR stop_times.txt:2 arrival_time="" [missing_required_time]'
          printf '%s\n' "$output" | grep -F 'ERROR stop_times.txt:4 arrival_time="25:00:00" [time_order_violation]'
          printf '%s\n' "$output" | grep -F 'ERROR calendar_dates.txt:3 service_id,date="WK,20261031" [duplicate_primary_key]'
          printf '%s\n' "$output" | grep -F 'FAIL: 6 parsed files, 9 records, 6 findings'
